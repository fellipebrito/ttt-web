<!doctype html>
<!-- OG image source, 1200x630. Render:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
    --headless=new --screenshot=og-cutline.png --window-size=1200,630 \
    --hide-scrollbars "file://$(pwd)/og.html"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "BBH Bogle";  src: url("fonts/BBHBogle_400.ttf");  }
  @font-face { font-family: "BBH Bartle"; src: url("fonts/BBHBartle_400.ttf"); }
  @font-face { font-family: "DM Sans";    src: url("fonts/DMSans_400.ttf");    }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: linear-gradient(160deg, #052D19 0%, #0A4728 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "DM Sans", sans-serif; color: #FEFBEE;
  }
  .the  { font-family: "BBH Bartle"; font-size: 26px; letter-spacing: 0.5em; text-indent: 0.5em; }
  .word { font-family: "BBH Bogle"; font-size: 150px; line-height: 0.92; color: #F3D653;
          text-shadow: 0 6px 30px rgba(0,0,0,0.4); }
  .rule { width: 430px; height: 6px; background: #F3D653; border-radius: 3px; margin: 12px 0; }
  .tag  { font-family: "BBH Bartle"; font-size: 22px; letter-spacing: 0.42em; text-indent: 0.42em; margin-top: 20px; }
  .sub  { margin-top: 34px; font-size: 26px; color: rgba(254,251,238,0.75); }
  .sub b { color: #F3D653; font-weight: 400; }
</style>
</head>
<body>
  <div class="the">THE</div>
  <div class="word">CUT</div>
  <div class="rule"></div>
  <div class="word">LINE</div>
  <div class="tag">SINK&nbsp;THE&nbsp;PUTT</div>
  <div class="sub">5 minutes · 9 putts · <b>Can you make the cut?</b></div>
</body>
</html>
