<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cut Line — favicon</title>
<style>
  @font-face{font-family:"Space Mono";font-weight:700;font-display:block;src:url("fonts/SpaceMono_700Bold.ttf") format("truetype");}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:512px;height:512px;}
  body{display:flex;align-items:center;justify-content:center;background:#467740;
    font-family:"Space Mono",monospace;-webkit-font-smoothing:antialiased;}
  .mark{
    width:392px;height:392px;background:#FFF8E3;border:20px solid #2A2622;
    box-shadow:26px 26px 0 #1F3A1B;
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-weight:700;font-size:210px;line-height:1;letter-spacing:0.02em;
  }
  .c{color:#2A2622;}
  .l{color:#E8B123;}
</style>
</head>
<body>
  <div class="mark"><span class="c">C</span><span class="l">L</span></div>
</body>
</html>
